<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Resort Mobile Emulator</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --phone-w: 393px;
      --phone-h: 844px;
      --scale: 0.9;
    }
    .device-shadow {
      box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.4), 0 0 0 12px #1f2327, 0 0 0 14px #2e343b, 0 0 0 16px #121518;
    }
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 105px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 30;
      pointer-events: none;
    }
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 4px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      z-index: 30;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-[#0f1418] text-slate-100 min-h-screen flex flex-col font-sans antialiased m-0 p-0 select-none">
  <!-- Top Bar Controls -->
  <header class="bg-[#181f26] border-b border-slate-700/60 px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow-md z-40">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm">
        📱
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-tight text-white leading-tight">The Resort · Mobile Emulator</h1>
        <p class="text-[11px] text-slate-400">Interactive live viewport preview</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap items-center gap-2">
      <!-- Target Environment -->
      <div class="flex items-center bg-[#10151b] rounded-lg p-1 border border-slate-700/60 text-xs">
        <button id="btn-env-local" onclick="setEnv('local')" class="px-2.5 py-1 rounded font-medium transition bg-emerald-600 text-white shadow-sm">
          Localhost (3000)
        </button>
        <button id="btn-env-vercel" onclick="setEnv('vercel')" class="px-2.5 py-1 rounded font-medium transition text-slate-300 hover:text-white">
          Vercel Live
        </button>
      </div>

      <!-- Device Preset -->
      <select id="device-select" onchange="changeDevice(this.value)" class="bg-[#10151b] border border-slate-700/60 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-200 outline-none hover:border-slate-500 transition cursor-pointer">
        <option value="iphone15">iPhone 15 Pro (393 × 852)</option>
        <option value="pixel8">Google Pixel 8 (412 × 915)</option>
        <option value="iphonese">iPhone SE (375 × 667)</option>
        <option value="ipad">iPad Mini (768 × 1024)</option>
      </select>

      <!-- Quick View Shortcuts -->
      <div class="flex items-center gap-1 bg-[#10151b] rounded-lg p-1 border border-slate-700/60 text-xs">
        <button onclick="navigate('/login')" class="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 text-[11px] transition">Sign-in</button>
        <button onclick="navigate('/')" class="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 text-[11px] transition">Workspace</button>
        <button onclick="navigate('/?view=tickets')" class="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 text-[11px] transition">Tickets</button>
        <button onclick="navigate('/?view=bookings')" class="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 text-[11px] transition">Bookings</button>
        <button onclick="navigate('/?view=facilities')" class="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 text-[11px] transition">Facilities</button>
      </div>

      <!-- Scale Controls -->
      <div class="flex items-center gap-1 bg-[#10151b] rounded-lg p-1 border border-slate-700/60 text-xs">
        <button onclick="setScale(0.75)" class="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 text-[11px]">75%</button>
        <button onclick="setScale(0.85)" class="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 text-[11px]">85%</button>
        <button onclick="setScale(1.0)" class="px-2 py-1 rounded hover:bg-slate-700 text-slate-300 text-[11px]">100%</button>
      </div>

      <!-- Reload -->
      <button onclick="reloadFrame()" title="Reload viewport" class="p-1.5 rounded-lg bg-[#10151b] border border-slate-700/60 hover:bg-slate-700 text-slate-300 transition">
        🔄
      </button>
    </div>
  </header>

  <!-- URL Address Bar -->
  <div class="bg-[#12181e] border-b border-slate-800/80 px-4 py-1.5 flex items-center justify-center text-xs text-slate-400 gap-2">
    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
    <span class="text-[11px]">Active Preview URL:</span>
    <span id="active-url-display" class="font-mono text-emerald-400 bg-slate-900/60 px-2.5 py-0.5 rounded border border-slate-700/40 text-[11px]">
      http://localhost:3000/login
    </span>
  </div>

  <!-- Stage Canvas -->
  <main class="flex-1 overflow-auto flex items-center justify-center p-6 bg-gradient-to-b from-[#0c0f13] to-[#141b22]">
    <div id="device-wrapper" class="transition-all duration-300 flex items-center justify-center" style="transform: scale(var(--scale)); transform-origin: center center;">
      <!-- Phone Frame -->
      <div id="phone-frame" class="device-shadow relative bg-black rounded-[50px] overflow-hidden transition-all duration-300" style="width: var(--phone-w); height: var(--phone-h);">
        
        <!-- Hardware Elements -->
        <div id="dynamic-island" class="dynamic-island"></div>
        <div class="home-indicator"></div>

        <!-- Embedded Live Screen -->
        <iframe
          id="preview-frame"
          src="http://localhost:3000/login"
          class="w-full h-full border-0 bg-white"
          allow="camera; microphone; geolocation"
        ></iframe>
      </div>
    </div>
  </main>

  <script>
    let currentBaseUrl = "http://localhost:3000";
    let currentPath = "/login";

    const devices = {
      iphone15: { w: "393px", h: "852px", radius: "50px", island: true },
      pixel8: { w: "412px", h: "915px", radius: "44px", island: false },
      iphonese: { w: "375px", h: "667px", radius: "36px", island: false },
      ipad: { w: "768px", h: "1024px", radius: "32px", island: false }
    };

    function setEnv(env) {
      const btnLocal = document.getElementById("btn-env-local");
      const btnVercel = document.getElementById("btn-env-vercel");

      if (env === "local") {
        currentBaseUrl = "http://localhost:3000";
        btnLocal.className = "px-2.5 py-1 rounded font-medium transition bg-emerald-600 text-white shadow-sm";
        btnVercel.className = "px-2.5 py-1 rounded font-medium transition text-slate-300 hover:text-white";
      } else {
        currentBaseUrl = "https://resortpms-retromadees-projects.vercel.app";
        btnVercel.className = "px-2.5 py-1 rounded font-medium transition bg-emerald-600 text-white shadow-sm";
        btnLocal.className = "px-2.5 py-1 rounded font-medium transition text-slate-300 hover:text-white";
      }
      updateUrl();
    }

    function changeDevice(name) {
      const dev = devices[name] || devices.iphone15;
      const root = document.documentElement;
      const frame = document.getElementById("phone-frame");
      const island = document.getElementById("dynamic-island");

      root.style.setProperty("--phone-w", dev.w);
      root.style.setProperty("--phone-h", dev.h);
      frame.style.borderRadius = dev.radius;
      island.style.display = dev.island ? "block" : "none";
    }

    function navigate(path) {
      currentPath = path;
      updateUrl();
    }

    function updateUrl() {
      const fullUrl = currentBaseUrl + currentPath;
      document.getElementById("preview-frame").src = fullUrl;
      document.getElementById("active-url-display").innerText = fullUrl;
    }

    function setScale(scaleVal) {
      document.documentElement.style.setProperty("--scale", scaleVal);
    }

    function reloadFrame() {
      const frame = document.getElementById("preview-frame");
      frame.src = frame.src;
    }
  </script>
</body>
</html>
